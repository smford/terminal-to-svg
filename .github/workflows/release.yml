name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
    paths:
      - 'cmd/**'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - '.goreleaser.yaml'
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Semantic Version bump type (patch, minor, major)'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculate and Apply Version Tag
        id: version
        env:
          REF_NAME: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
          BUMP_INPUT: ${{ inputs.bump_type || github.event.inputs.bump_type }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force

          # If triggered directly by a tag push
          if [[ "$REF_NAME" == refs/tags/v* ]]; then
            TAG="${REF_NAME#refs/tags/}"
            echo "Triggered by existing tag push: $TAG"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
            echo "skipped=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # If the current HEAD commit is already tagged
          EXISTING_TAG=$(git tag --points-at HEAD)
          if [ -n "$EXISTING_TAG" ]; then
            echo "Commit is already tagged as: $EXISTING_TAG"
            echo "tag=$EXISTING_TAG" >> "$GITHUB_OUTPUT"
            echo "version=${EXISTING_TAG#v}" >> "$GITHUB_OUTPUT"
            echo "skipped=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Resolve latest semver tag
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Latest existing tag: $LATEST_TAG"

          # Verify that application code actually changed since latest tag (unless manual dispatch)
          if [ "$LATEST_TAG" != "v0.0.0" ] && [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            APP_DIFF=$(git diff --name-only "$LATEST_TAG"..HEAD -- 'cmd/**' 'go.mod' 'go.sum' 'Dockerfile' '.goreleaser.yaml')
            if [ -z "$APP_DIFF" ]; then
              echo "No application code changes detected since $LATEST_TAG. Skipping release."
              echo "skipped=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Application changes detected since $LATEST_TAG:"
            echo "$APP_DIFF"
          fi

          V=${LATEST_TAG#v}
          MAJOR=$(echo "$V" | cut -d. -f1)
          MINOR=$(echo "$V" | cut -d. -f2)
          PATCH=$(echo "$V" | cut -d. -f3)
          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}

          BUMP="$BUMP_INPUT"
          if [ -z "$BUMP" ]; then
            # Inspect commits since latest tag for conventional commit prefix
            COMMITS=$(git log "$LATEST_TAG"..HEAD --oneline 2>/dev/null || git log --oneline)
            if echo "$COMMITS" | grep -qE "breaking|!:"; then
              BUMP="major"
            elif echo "$COMMITS" | grep -qE "^[a-f0-9]+ feat"; then
              BUMP="minor"
            else
              BUMP="patch"
            fi
          fi

          if [ "$LATEST_TAG" = "v0.0.0" ]; then
            NEW_TAG="v0.1.0"
          else
            case "$BUMP" in
              major)
                NEW_TAG="v$((MAJOR + 1)).0.0"
                ;;
              minor)
                NEW_TAG="v${MAJOR}.$((MINOR + 1)).0"
                ;;
              patch)
                NEW_TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))"
                ;;
            esac
          fi

          echo "Calculated new version tag: $NEW_TAG"
          git tag -a "$NEW_TAG" -m "Release $NEW_TAG"
          git push origin "$NEW_TAG"

          echo "tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${NEW_TAG#v}" >> "$GITHUB_OUTPUT"
          echo "skipped=false" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        if: steps.version.outputs.skipped != 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'
          check-latest: true

      - name: Set up QEMU
        if: steps.version.outputs.skipped != 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        if: steps.version.outputs.skipped != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        if: steps.version.outputs.skipped != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        if: steps.version.outputs.skipped != 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Ensure Tag Loaded for GoReleaser
        if: steps.version.outputs.skipped != 'true'
        run: |
          git fetch --tags --force

      - name: Run GoReleaser
        if: steps.version.outputs.skipped != 'true'
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Homebrew Formula
        id: formula
        if: steps.version.outputs.skipped != 'true'
        env:
          TAG_NAME: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "Generating formula for $TAG_NAME (version $VERSION)..."
          chmod +x scripts/generate_formula.sh
          ./scripts/generate_formula.sh "$VERSION" "$TAG_NAME" "dist" "dist/termtosvg.rb"

      - name: Upload Formula to Release Assets
        if: steps.version.outputs.skipped != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.version.outputs.tag }}
        run: |
          gh release upload "$TAG_NAME" dist/termtosvg.rb --clobber

      - name: Publish Homebrew Formula to Tap
        if: steps.version.outputs.skipped != 'true'
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.version.outputs.tag }}
        run: |
          if [ -n "${TAP_TOKEN}" ]; then
            echo "Publishing updated formula to smford/homebrew-tap..."
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git clone "https://x-access-token:${TAP_TOKEN}@github.com/smford/homebrew-tap.git" tap_repo
            mkdir -p tap_repo/Formula
            cp dist/termtosvg.rb tap_repo/Formula/termtosvg.rb
            cd tap_repo
            git add Formula/termtosvg.rb
            if git commit -m "feat(formula): update termtosvg to ${TAG_NAME}"; then
              git push origin main
              echo "Successfully pushed formula update to smford/homebrew-tap"
            else
              echo "Formula in tap is already up to date"
            fi
            cd ..
            rm -rf tap_repo
          else
            echo "::warning::HOMEBREW_TAP_GITHUB_TOKEN secret is not set. Formula available in release assets."
          fi

      - name: Trigger GitHub Pages Deployment
        if: steps.version.outputs.skipped != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.version.outputs.tag }}
        run: |
          echo "Triggering pages.yml deployment with version: ${TAG_NAME}"
          gh workflow run pages.yml -f version="${TAG_NAME}" || echo "Warning: Could not trigger pages.yml dispatch directly"
