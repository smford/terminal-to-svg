<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 414" width="650" height="414">
  <defs>
    <style>
      .tui { font-family: ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, Monaco, Consolas, 'Courier New', monospace; font-size: 13px; font-variant-ligatures: none; fill: #e2e8f0; }
