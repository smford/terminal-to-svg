      <text x="0" y="0" class="tui bold" fill="#e2e8f0">Sanitized Audit Log</text>




      <rect x="504" y="-13" width="144" height="18" fill="#10b981" rx="2"/>
      <text x="576" y="0" text-anchor="middle" class="tui bold" fill="#ffffff" font-size="11">SANITIZED: TRUE</text>

    </g>
    <line x1="16" y1="36" x2="662" y2="36" stroke="#3d4255" stroke-width="1"/>



    <g transform="translate(16, 56)">
      <text x="0" y="0" class="tui"><tspan x="0.00" class="bold" style="fill: #38bdf8;">➜&#160;&#160;curl&#160;-H&#160;&#34;Authorization:&#160;Bearer&#160;[REDACTED_TOKEN]&#34;&#160;https://[REDACTED_IP]/api/lo</tspan></text>
      <text x="0" y="21" class="tui"><tspan x="0.00" class="bold" style="fill: #38bdf8;">gin</tspan></text>
      <text x="0" y="42" class="tui"><tspan x="0.00" style="fill: #10b981;">HTTP/2&#160;200&#160;OK</tspan></text>
      <text x="0" y="63" class="tui"><tspan x="0.00" style="fill: #3b82f6;">client_ip:</tspan><tspan x="80.00">&#160;[REDACTED_IP]</tspan></text>
      <text x="0" y="84" class="tui"><tspan x="0.00" style="fill: #3b82f6;">password:[REDACTED_PASSWORD]&#160;super_secret_pass_123</tspan></text>
      <text x="0" y="105" class="tui"><tspan x="0.00" style="fill: #3b82f6;">jwt:</tspan><tspan x="32.00">&#160;[REDACTED_JWT]</tspan></text>


