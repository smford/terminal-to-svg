<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 748 320" width="748" height="320">
  <defs>
    <style>
      .tui { font-family: ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, Monaco, Consolas, 'Courier New', monospace; font-size: 13px; font-variant-ligatures: none; fill: #e2e8f0; }
      .dim { fill: #94a3b8; }
      .dark-dim { fill: #64748b; }
      .cyan { fill: #38bdf8; }
      .green { fill: #10b981; font-weight: 700; }
      .amber { fill: #f59e0b; font-weight: 700; }
      .red { fill: #ef4444; font-weight: 700; }
      .bold { font-weight: 700; }
      .italic { font-style: italic; }
      .underline { text-decoration: underline; }
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      .cursor { animation: blink 1s infinite; fill: #e2e8f0; opacity: 0.8; }
    </style>

    <filter id="winShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

  </defs>



  <rect x="15" y="15" width="718" height="290" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" filter="url(#winShadow)"/>


  <path d="M 15 27 Q 15 15 27 15 L 721 15 Q 733 15 733 27 L 733 50 L 15 50 Z" fill="#1e293b"/>
  <line x1="15" y1="50" x2="733" y2="50" stroke="#334155" stroke-width="1"/>


  <circle cx="38" cy="32" r="6" fill="#ef4444"/>
  <circle cx="58" cy="32" r="6" fill="#f59e0b"/>
  <circle cx="78" cy="32" r="6" fill="#10b981"/>
  <text x="374" y="36" text-anchor="middle" class="tui" fill="#64748b" font-size="12">Security Redaction Demo</text>





  <g transform="translate(35, 68)">

