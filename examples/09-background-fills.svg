      <rect x="16.00" y="11" width="472.00" height="21" fill="#3b82f6" rx="2"/><text x="0" y="21" class="tui"><tspan x="0.00">&#160;&#160;</tspan><tspan x="16.00" style="fill: #cbd5e1; background-color: #3b82f6;">[1]&#160;Auth&#160;Service&#160;&#160;&#160;&#160;&#160;CPU:&#160;12%&#160;&#160;MEM:&#160;&#160;420MB&#160;&#160;STATUS:&#160;RUNNING</tspan></text>
      <rect x="16.00" y="32" width="472.00" height="21" fill="#10b981" rx="2"/><text x="0" y="42" class="tui"><tspan x="0.00">&#160;&#160;</tspan><tspan x="16.00" style="fill: #0f172a; background-color: #10b981;">[2]&#160;Payment&#160;Gateway&#160;&#160;CPU:&#160;45%&#160;&#160;MEM:&#160;1240MB&#160;&#160;STATUS:&#160;RUNNING</tspan></text>
      <rect x="16.00" y="53" width="480.00" height="21" fill="#ef4444" rx="2"/><text x="0" y="63" class="tui"><tspan x="0.00">&#160;&#160;</tspan><tspan x="16.00" style="fill: #cbd5e1; background-color: #ef4444;">[3]&#160;Cache&#160;Replica&#160;03&#160;CPU:&#160;98%&#160;&#160;MEM:&#160;3800MB&#160;&#160;STATUS:&#160;CRITICAL</tspan></text>
      <rect x="16.00" y="74" width="448.00" height="21" fill="#444444" rx="2"/><text x="0" y="84" class="tui"><tspan x="0.00">&#160;&#160;</tspan><tspan x="16.00" style="fill: #cbd5e1; background-color: #444444;">[4]&#160;Worker&#160;Node&#160;04&#160;&#160;&#160;CPU:&#160;&#160;0%&#160;&#160;MEM:&#160;&#160;120MB&#160;&#160;STATUS:&#160;IDLE</tspan></text>

      
